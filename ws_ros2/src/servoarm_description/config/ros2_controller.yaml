# ROS2 ros2_control configuration for 6-DOF MG996R arm
# Controller: ESP32 via rosserial or micro-ROS

controller_manager:
  ros__parameters:
    update_rate: 50  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # ── CHANGED: Switched from a complex action controller to a direct topic position controller
    gripper_action_controller:
      type: position_controllers/JointGroupPositionController

joint_state_broadcaster:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
      - joint_7
    interfaces:
      - position
      - velocity
    
arm_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    open_loop_control: true
    allow_partial_joints_goal: false
    action_monitor_rate: 20.0
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0
      joint_1:
        goal: 0.05
      joint_2:
        goal: 0.05
      joint_3:
        goal: 0.05
      joint_4:
        goal: 0.05
      joint_5:
        goal: 0.05

# ── CHANGED: Rewritten to support the JointGroupPositionController array schema
gripper_action_controller:
  ros__parameters:
    joints:
      - joint_6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity